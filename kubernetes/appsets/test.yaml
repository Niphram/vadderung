apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: test-appset
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: [ "missingkey=error" ]
  generators:
  - merge:
      mergeKeys:
      - path.path
      generators:
      - git:
          repoURL: https://github.com/niphram/vadderung
          revision: HEAD
          #pathParamPrefix: directory
          directories:
          - path: kubernetes/apps/dynamic-prefix-operator-system/*
      - git:
          repoURL: https://github.com/niphram/vadderung
          revision: HEAD
          #pathParamPrefix: file
          files:
          - path: kubernetes/apps/dynamic-prefix-operator-system/*/application.yaml

  template:
    metadata:
      name: 'test-{{ dig "nameOverride" "" . }}-{{ .path.basename }}'
    spec:
      # The project the application belongs to.
      project: default

      # Source of the application manifests
      sources: []
      # Destination cluster and namespace to deploy the application
      destination:
        server: https://kubernetes.default.svc
        namespace: "test"

      # Sync policy
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        automated:
          # automated sync by default retries failed attempts 5 times with following delays between attempts ( 5s, 10s, 20s, 40s, 80s ); retry controlled using `retry` field.
          prune: true # Specifies if resources should be pruned during auto-syncing ( false by default ).
          selfHeal: true # Specifies if partial app sync should be executed when resources are changed only in target Kubernetes cluster and no git change detected ( false by default ).
