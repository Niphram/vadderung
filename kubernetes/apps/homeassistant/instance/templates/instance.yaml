apiVersion: ha.homeassistant.io/v1
kind: HomeAssistant
metadata:
  name: {{ .Release.Name }}-home
spec:
  version: "2025.6"
  storage:
    size: 5Gi
    storageClassName: longhorn-3
  service:
    type: ClusterIP
  bootstrap:
    enabled: true
    location:
        name: {{ .Values.homeassistant.location.name | quote }}
        latitude: {{ .Values.homeassistant.location.latitude | quote }}
        longitude: {{ .Values.homeassistant.location.longitude | quote }}
        elevation: {{ .Values.homeassistant.location.elevation }}
        unitSystem: {{ .Values.homeassistant.location.unitSystem | quote }}
        currency: {{ .Values.homeassistant.location.currency | quote }}
        timeZone: {{ .Values.homeassistant.location.timeZone | quote }}
    credentials:
      secretRef:
        name: homeassistant-admin
    createApiToken: true