mosquitto:
  architecture:
    mode: federated

  auth:
    enabled: true

  broker:
    replicaCount: 3

  pdb:
    enabled: true
    minAvailable: 2

  service:
    sessionAffinity: None
    type: LoadBalancer
    mqttNodePort: 31883
    websocketNodePort: 31901
    annotations:
      io.cilium/lb-ipam-ips: 192.168.178.215
