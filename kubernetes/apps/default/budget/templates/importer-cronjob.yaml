apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-importer-cron
spec:
  schedule: "@midnight"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: importer
            image: gared/firefly-iii-fints-console-importer:2.0.0
            imagePullPolicy: IfNotPresent
            command:
            - bin/console
            - import-transactions
            - --config data/config/config.json
            volumeMounts:
              - name: data
                mountPath: /app/data/
        volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-importer-pvc
          restartPolicy: Never
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-setup
spec:
  schedule: "0 0 30 2 *" # Never schedule
  jobTemplate:
    spec:
      suspend: true
      template:
        spec:
          containers:
          - name: importer
            image: gared/firefly-iii-fints-console-importer:2.0.0
            imagePullPolicy: IfNotPresent
            command:
            - bin/console
            - config:generate
            volumeMounts:
              - name: data
                mountPath: /app/data/
        volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-importer-pvc
          restartPolicy: Never
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-importer-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-3
  resources:
    requests:
      storage: 50M
