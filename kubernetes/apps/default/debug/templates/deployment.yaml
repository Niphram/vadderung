apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deployment
spec:
  selector:
    matchLabels:
      app: http-https-app
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app: http-https-app
    spec:
      containers:
        - name: http-https
          image: mendhak/http-https-echo:41
          ports:
            - containerPort: 8080
