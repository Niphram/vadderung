vadderung:
  baseDomain: ~

kube-prometheus-stack:
  grafana:
    grafana.ini:
      users:
        allow_sign_up: false
        auto_assign_org: true
        auto_assign_org_role: Editor
      auth.proxy:
        enabled: true
        header_name: Remote-User
        header_property: username
        auto_sign_up: true
        headers: "Name:Remote-Name Email:Remote-Email"

  prometheus:
    prometheusSpec:
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn-2
            accessModes: [ "ReadWriteOnce" ]
            resources:
              requests:
                storage: 10Gi

  alertmanager:
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn-2
            accessModes: [ "ReadWriteOnce" ]
            resources:
              requests:
                storage: 2Gi

  nodeExporter:
    enabled: true

  kubeStateMetrics:
    enabled: true
